name: "6. Deploy to staging"
on:
  workflow_call:
    inputs:
      app_name:        { type: string, required: true }
      version:         { type: string, required: true }
      run_smoke_tests: { type: string, default: "yes" }

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TEST_BACKEND_URL: http://localhost:8080
      SPRING_PROFILES_ACTIVE: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1

      - name: Build jar
        run: gradle :app:bootJar --no-daemon -x test

      - name: Deploy (start app with stage profile)
        run: |
          JAR=$(ls app/build/libs/*.jar | grep -v plain)
          echo "Starting $JAR with profile $SPRING_PROFILES_ACTIVE"
          nohup java -jar "$JAR" > app.log 2>&1 &

      - name: Wait for staging
        id: wait
        run: |
          for i in {1..60}; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$TEST_BACKEND_URL/actuator/health" || true)
            if [ "$CODE" != "000" ]; then
              echo "Staging is up (HTTP $CODE)"
              exit 0
            fi
            echo "Waiting for staging... ($i/60)"
            sleep 5
          done
          echo "Staging did not come up"
          cat app.log
          exit 1

      - name: Smoke tests
        if: inputs.run_smoke_tests == 'yes'
        run: gradle :app:smokeTest --no-daemon

      - name: Security tests
        if: always() && steps.wait.outcome == 'success'
        run: gradle :app:securityTest --no-daemon

      - name: Integration tests
        if: always() && steps.wait.outcome == 'success'
        run: gradle :app:integrationTest --no-daemon

      - name: Write test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("## Staging test results\n")
          print("| Suite | Total | Passed | Failed | Errors | Skipped |")
          print("|---|---|---|---|---|---|")
          failed = []
          for task in ["smokeTest", "securityTest", "integrationTest"]:
              files = glob.glob(f"app/build/test-results/{task}/*.xml")
              if not files:
                  print(f"| {task} | not run | | | | |")
                  continue
              t = f = e = s = 0
              for path in files:
                  suite = ET.parse(path).getroot()
                  t += int(suite.get("tests", 0)); f += int(suite.get("failures", 0))
                  e += int(suite.get("errors", 0)); s += int(suite.get("skipped", 0))
                  for case in suite.iter("testcase"):
                      if case.find("failure") is not None or case.find("error") is not None:
                          failed.append(f'{task}: {case.get("classname")}.{case.get("name")}')
              print(f"| {task} | {t} | {t-f-e-s} | {f} | {e} | {s} |")
          if failed:
              print("\n### Failed tests")
              for name in failed:
                  print(f"- {name}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-test-reports
          path: |
            app/build/reports/tests/smokeTest/
            app/build/reports/tests/securityTest/
            app/build/reports/tests/integrationTest/
          if-no-files-found: ignore

      - name: Show app log
        if: always()
        run: tail -n 50 app.log || echo "No app.log (app never started)"
