name: "9. Notify"
on:
  workflow_call:
    inputs:
      version:         { type: string, required: true }
      status:          { type: string, required: true }
      environment:     { type: string, default: "staging" }
      run_smoke_tests: { type: string, default: "yes" }
      results:         { type: string, default: "{}" }
    secrets:
      SLACK_WEBHOOK_URL: { required: true }

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send detailed Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ inputs.version }}
          STATUS: ${{ inputs.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          SMOKE: ${{ inputs.run_smoke_tests }}
          RESULTS: ${{ inputs.results }}
          ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi

          JOBS=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | (if .value.result == "success" then ":white_check_mark:"
               elif .value.result == "skipped" then ":fast_forward:"
               elif .value.result == "cancelled" then ":no_entry_sign:"
               else ":x:" end) + " " + .key + ": " + .value.result')
          [ -z "$JOBS" ] && JOBS="(no job details)"

          TEXT="$ICON *ci-cd-pipeline: $STATUS*
          *Repo:* $GITHUB_REPOSITORY
          *Version:* $VERSION
          *Environment:* $ENVIRONMENT
          *Smoke tests:* $SMOKE
          *Started by:* $ACTOR ($EVENT)
          *Branch:* $BRANCH  *Commit:* ${SHA:0:7}

          *Jobs:*
          $JOBS

          <$RUN_URL|See the run on GitHub>"

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
