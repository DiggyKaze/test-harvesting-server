# Dummy CI/CD pipeline


name: ci-cd-pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [staging, production]
        default: staging
      run_smoke_tests:
        description: "run smoke test?"
        type: choice
        options: ["yes", "no"]
        default: "yes"
  schedule:
    - cron: "0 5 * * 1"
  workflow_call:
    inputs:
      environment:
        type: string
        default: staging
      run_smoke_tests:
        default: "yes"

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  settings:
    uses: ./.github/workflows/10-settings.yaml
    with:
      environment: ${{ inputs.environment || 'staging' }}
      run_smoke_tests: ${{ inputs.run_smoke_tests || 'yes' }}

  bootstrap:
    needs: settings
    uses: ./.github/workflows/00-bootstrap.yaml

  lint:
    needs: bootstrap
    uses: ./.github/workflows/01-lint.yaml
  
  unit-test:
    needs: bootstrap
    uses: ./.github/workflows/02-unit-test.yaml

  security-scan:
    needs: bootstrap
    uses: ./.github/workflows/03-security-scan.yaml

  integration-test:
    needs: [lint, unit-test, security-scan]
    uses: ./.github/workflows/04-integration-test.yaml

  package:
    needs: integration-test
    uses: ./.github/workflows/05-package.yaml
    with:
      app_name: demo-service
      version: 1.0.${{github.run_number}}
      registry: registry.example.com
  
  deploy-staging:
    needs: [settings, package]
    uses: ./.github/workflows/06-deploy-staging.yaml
    with:
      app_name: demo-service
      version: 1.0.${{ github.run_number }}
      run_smoke_tests: ${{ needs.settings.outputs.run_smoke_tests }}



  approval:
    needs: [settings, deploy-staging]
    if: needs.settings.outputs.environment == 'production'
    uses: ./.github/workflows/07-approval.yaml

  deploy-production:
    needs: [settings, approval]
    if: needs.settings.outputs.environment == 'production'
    uses: ./.github/workflows/08-deploy-production.yaml
    with:
      app_name: demo-service
      version: 1.0.${{ github.run_number}}

  notify:
    needs: [settings, deploy-staging, deploy-production]
    if: always()
    uses: ./.github/workflows/09-notify.yaml
    with:
      version: 1.0.${{ github.run_number}}
      status: ${{ needs.settings.outputs.environment == 'production' && needs.deploy-production.result || needs.deploy-staging.result }}
    secrets: inherit
